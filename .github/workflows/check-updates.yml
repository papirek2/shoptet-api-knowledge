# CZ: Automatická kontrola aktualizací Shoptet API spec každý týden
# EN: Automatic weekly check for Shoptet API spec updates

name: Check Shoptet API Updates

on:
  schedule:
    - cron: '0 8 * * 1'  # CZ: Každé pondělí v 8:00 UTC / EN: Every Monday at 8:00 UTC
  workflow_dispatch:       # CZ: Lze spustit ručně / EN: Can be triggered manually

jobs:
  check-updates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current Shoptet OpenAPI spec
        run: |
          curl -sSL "https://api.docs.shoptet.com/shoptet-api/openapi.yaml" \
            -o openapi-new.yaml \
            --fail \
            --max-time 30
          echo "Downloaded new spec, size: $(wc -l < openapi-new.yaml) lines"

      - name: Compare specs
        id: compare
        run: |
          if diff -q openapi.yaml openapi-new.yaml > /dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No changes detected in Shoptet API spec."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            
            # CZ: Zjisti přidané a odebrané endpointy / EN: Find added and removed endpoints
            OLD_PATHS=$(grep -E "^  /api/" openapi.yaml | sort)
            NEW_PATHS=$(grep -E "^  /api/" openapi-new.yaml | sort)
            
            ADDED=$(comm -13 <(echo "$OLD_PATHS") <(echo "$NEW_PATHS"))
            REMOVED=$(comm -23 <(echo "$OLD_PATHS") <(echo "$NEW_PATHS"))
            
            # CZ: Verze specifikace / EN: Spec version
            OLD_VERSION=$(grep "^  version:" openapi.yaml | awk '{print $2}')
            NEW_VERSION=$(grep "^  version:" openapi-new.yaml | awk '{print $2}')
            
            # CZ: Ulož výstup pro issue / EN: Save output for issue
            {
              echo "old_version=$OLD_VERSION"
              echo "new_version=$NEW_VERSION"
            } >> $GITHUB_OUTPUT
            
            # CZ: Ulož diff do souboru / EN: Save diff to file
            {
              echo "## Změny / Changes"
              echo ""
              echo "**Stará verze / Old version:** \`$OLD_VERSION\`"
              echo "**Nová verze / New version:** \`$NEW_VERSION\`"
              echo ""
              
              if [ -n "$ADDED" ]; then
                echo "### ✅ Přidané endpointy / Added endpoints"
                echo '```'
                echo "$ADDED"
                echo '```'
                echo ""
              fi
              
              if [ -n "$REMOVED" ]; then
                echo "### ❌ Odebrané endpointy / Removed endpoints"
                echo '```'
                echo "$REMOVED"
                echo '```'
                echo ""
              fi
              
              echo "### 📄 Kompletní diff (prvních 200 řádků) / Full diff (first 200 lines)"
              echo '```diff'
              diff openapi.yaml openapi-new.yaml | head -200
              echo '```'
            } > diff_output.md
            
            echo "📢 Changes detected! Creating issue..."
          fi

      - name: Create GitHub Issue on change
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diffOutput = fs.readFileSync('diff_output.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            const title = '🔄 Shoptet API spec aktualizovana / updated — ' + date;
            const header = '## Shoptet API spec byla aktualizovana / updated\n\n';
            const desc = 'CZ: Automaticka kontrola zjistila zmeny v OpenAPI specifikaci Shoptetu.\n' +
              'EN: Automated check detected changes in Shoptet OpenAPI spec.\n\n';
            const footer = '\n\n---\n*CZ: Generovano automaticky GitHub Actions / EN: Auto-generated by GitHub Actions*';
            const body = header + desc + diffOutput + footer;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['api-update']
            });

      - name: Update openapi.yaml if changed
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp openapi-new.yaml openapi.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.yaml
          git commit -m "chore: update openapi.yaml to version ${{ steps.compare.outputs.new_version }}"
          git push
